<!DOCTYPE html>
<html lang="en-us">
    <head>
        <title>Member Portal 2026</title>
        <style>
            nav ul
            {
                display: flex;
                list-style: none;
                background-color: #333;
            }
            nav a
            {
                color: white;
                padding: 15px;
                text-decoration: none;
            }
            nav a:hover
            {
                background-color: gold;
                color:black;
            }
            h1::first-letter
            {
                font-size: 50px;
                color: #ff4500;
                font-weight: bold;
            }
            .intro-text::selection
            {
                background-color: lightblue;
                color: white;
            }
            input:focus
            {
                border: 2px solid green;
                background-color: #f0fff0;
            }
            button
            {
                opacity: 0.6;
                background-color: blue;
                color:white;
            }
            button:hover
            {
                opacity: 1.0;
                cursor: pointer;
            }
            footer
            {
                margin-top: 50px;
                text-align: center;
                opacity: 0.8;
            }
        </style>
    </head>
    <body>
        <header>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Trends</a></li>
                    <li><a href="#">Register</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>
        <section class="poratl-container">
            <h1>Join the Future</h1>
            <p class="intro-text">Lorem Ipsum</p>
            <form class="reg-form">
                <div>
                    <label for="fullname">Full Name</label><br>
                    <input type="text" id="fullname"><br>
                </div>
                <div>
                    <label for="email">Email Address</label><br>
                    <input type="email" id="email"><br>
                </div>
                <br>
                
                <button type="submit">Create Account</button>
            </form>
        </section>
        <footer>
            <p>© 2026 Tech Revolution. All rights reserved.</p>
        </footer>
    </body>
</html>
