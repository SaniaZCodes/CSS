<!DOCTYPE html>
<html>
    <head>
        <title>The Pro Task-Manager Card</title>
        <style>
            .dashboard-container
            {
                max-width: 700px;
                margin: 50px auto;
                position: relative;
                padding: 20px;
                border: 1px solid #ccc;
            }
            ul
            {
                display: flex;
                list-style: none;
                padding: 0;
            }
            li
            {
                margin-right: 15px;
                background-color: #f0f0f0;
                padding: 8px 12px;
                border-radius: 4px;
            }
            table
            {
                width: 100%;
                margin-top: 20px;
                border-collapse: collapse;
            }
            th, td
            {
                border: 1px solid #ddd;
                padding: 12px;
                text-align: left;
            }
            th
            {
                background-color: #333;
                color: white;
            }
            .status-badge
            {
                position: absolute;
                top: -15px;
                right: -15px; 
                z-index: 10;
                background-color: red;
                color: white;
                padding: 5px 10px;
                font-weight: bold;
                box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            }
            .footer-note
            {
                display: none;
                margin-top: 15px;
                color: gray;
                font-style: italic;
            }
            .dashboard-container:hover .footer-note 
            { 
                display: block; 
            }
        </style>
    </head>
    <body>
        <div class="dashboard-container">
            <ul>
                    <li>All Tasks</li>
                    <li>Ongoing</li>
                    <li>Archived</li>
                </ul>
                <table>
                    <tr>
                        <th>Task Name</th>
                        <th>Deadline</th>
                        <th>Status</th>
                    </tr>
                    <tr>
                        <td>Navbar Fix</td>
                        <td>Tuesday</td>
                        <td>Completed</td>
                    </tr>
                    <tr>
                        <td>API Integration</td>
                        <td>Friday</td>
                        <td>Pending</td>
                    </tr>
                    <tr>
                        <td>Database Setup</td>
                        <td>Monday</td>
                        <td>Submitted</td>
                    </tr>
                </table>
            <div class="status-badge">3 New Alerts</div>
            <div class="footer-note">Confidential Data</div>
        </div>
    </body>
</html>
