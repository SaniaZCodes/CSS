<!DOCTYPE html>
<html>
    <head>
        <title>The Automated Order Portal</title>
        <style>
            body
            {
                font-size: 16px;  
                font-family: sans-serif;
            }
            .parent-container
            {
                color: #2c3e50;
                border:1px solid #ccc;
            }
            .sidebar
            {
                width: 25vw;
                padding: 2rem;
            }
            ol
            {
                list-style: none;
                counter-reset: my-step-counter;
            }
            ol li
            {
                margin-bottom: 10px;
            }
            ol li::before
            {
                counter-increment: my-step-counter;
                content: "Step " counter(my-step-counter) " - ";
                color: #e67e22; 
                font-weight: bold;
            }
            fieldset
            {
                border: 2px dashed #2c3e50; 
                padding: 20px;
            }
            label, input, select, textarea
            {
                display: block;
                width: 100%;
            }
            input, select, textarea
            {
                margin-top: 5px;
                margin-bottom: 15px;
            }
            textarea
            {
                height:80px;
                resize:vertical;
            }
            .order-form
            {
                font-size: 1.5em;
            }
        </style>
    </head>
    <body>
        <div class="parent-container">
            <aside class="sidebar">
                <ul>
                    <li><a href="#">Dashboard</a></li>
                    <li><a href="#">Orders</a></li>
                    <li><a href="#">Settings</a></li>
                </ul>
            </aside>
        </div>
        <section class="steps-section">
            <h2>Order Progress</h2>
            <ol>
                <li>Select Item</li>
                <li>Enter Details</li>
                <li>Confirm  & Pay</li>
            </ol>
        </section>
        <form class="order-form">
            <fieldset>
                <legend>Order Details</legend>
                <label for="category">Category</label>
                <select id="category">
                    <option>Electronics</option>
                    <option>Fashion</option>
                    <option>Home</option>
                </select>
                <label for="qyt">Quantity</label>
                <input type="number" id="qyt">
                <label for="msg">Special Notes</label>
                <textarea id="msg" placeholder="Any special requests?"></textarea>
                <button type="submit">Place Order</button>
            </fieldset>
        </form>
    </body>
</html>
