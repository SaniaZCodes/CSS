<!DOCTYPE html>
<html>
    <head>
        <title>The Hero Profile Card</title>
        <style>
            .hero-card
            {
                width: 350px;
                background-color: #111;
                color: #fff;
                padding: 20px;
                border-radius: 20px;
                text-align: center;
                margin: 50px auto;
            }
            .image-mask
            {
                height: 250px;
                overflow: hidden;
                -webkit-mask-image: radial-gradient(circle, black 40%, rgba(0,0,0,0) 75%);
                mask-image: radial-gradient(circle, black 40%, rgba(0,0,0,0) 75%);
            }
            .hero-img
            {
                width: 100%;
                height:100%;
                object-fit: cover;
                object-position: center 10%;
            }
            .action-btn 
            {
                background: linear-gradient(45deg, #00ffcc, #0099ff);
                border: none;
                padding: 12px 35px;
                border-radius: 5px;
                color: #000;
                font-weight: bold;
                text-transform: uppercase;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
                position: relative;
                overflow: hidden;
            }
            .action-btn:hover 
            {
                transform: translateY(-3px);
                box-shadow: 0 0 20px #00ffcc, 0 0 40px rgba(0, 153, 255, 0.5);
                color: #fff;
                letter-spacing: 1px;
            }
        </style>
    </head>
    <body>
        <section class="hero-card">
            <div class="image-mask">
                <img class="hero-img" alt="Hero Portrait" src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=1000&auto=format&fit=crop">
            </div>
            <div class="hero-info">
                <h2>Cyber Commander</h2>
                <p>Tactical specialist and front-line defender of the digital realm.</p>
                <button class="action-btn">Deploy Now</button>
            </div>
        </section>
    </body>
</html>
