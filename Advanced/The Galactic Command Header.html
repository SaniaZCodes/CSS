<!DOCTYPE html>
<html>
    <head>
        <title>The Galactic Command Header</title>
        <style>
            .flex-header
            {
                background-color: #000;
                align-items: center;
                color: #00ffcc;
                justify-content: space-between;
                padding: 15px 30px;
                display: flex;
            }
            .nav-links
            {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
                gap: 25px;
            }
            .status-badge
            {
                background: #00ffcc;
                flex-shrink: 0;
                color: #000;
                padding: 5px 15px;
                border-radius: 20px;
            }
        </style>
    </head>
    <body>
        <nav class="flex-header">
            <div class="logo">
                <h2>CORE-OS</h2>
            </div>
            <ul class="nav-links">
                <li>Dashboard</li>
                <li>Engine</li>
                <li>Weapons</li>
            </ul>
            <div class="status-badge">
                <span>Online</span>
            </div>
        </nav>
    </body>
</html>
